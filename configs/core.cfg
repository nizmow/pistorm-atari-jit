# core.cfg — minimal real-ST configuration for `make MINIMAL=1` builds.
#
# Every emulator extra is OFF: no IDE, no FDD emulation, no DMA sound,
# no YM2149/PSG audio capture, no networking, no USB keyboard, no ET4000.
# The machine is the CPU+JIT core talking to the REAL Atari chipset over
# the bus: real Shifter video, real MFP/GLUE interrupts, real PSG sound,
# real ACIA keyboard.
#
# Memory policy (pistorm_natmem.cpp sr_* accessors):
#   DEFAULT (stram_cache unset = off): every ST-RAM WRITE is a real bus
#   write to real DRAM — DMA masters (blitter/FDC/ACSI) always see true
#   memory — while READS ride the natmem mirror for speed. The mirror can
#   only go stale if an external master WRITES real DRAM (the CPLD BGACK
#   observation + mirror invalidation is the future fix).
#   stram_nomirror: belt-and-braces — READS AND WRITES both go over the
#   real bus (the jan-2025 "everything real" behaviour, ~3.7 MB/s).
#   Leave stram_direct OFF (default): the direct window is raw mirror
#   with NO write-through — the opposite of coherent.

cpu 68030
fpu
blitter
machine st

stram_cache off

# stram_nomirror   # uncomment for zero shadow RAM (all real-bus)

ttram 128M
rom ../roms/emutos-aranym.rom

# --- everything below is explicitly off ------------------------------
ide off
network disabled
ym2149 off
dma_sound off
# NOTE: `fdd` takes an IMAGE PATH (any argument enables it) - to disable,
# omit the line entirely. Same for `kbd` (USB keyboard): omitted = off.
